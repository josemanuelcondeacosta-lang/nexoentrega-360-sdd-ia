services:
  database:
    image: postgres:17.6-bookworm
    environment:
      POSTGRES_DB: nexo
      POSTGRES_USER: nexo
      POSTGRES_PASSWORD: nexo_demo_only
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U nexo -d nexo"]
      interval: 2s
      timeout: 3s
      retries: 25
    volumes:
      - nexo_data:/var/lib/postgresql/data
  app:
    build: ./apps/nexo
    ports: ["127.0.0.1:8000:8000"]
    environment:
      APP_ENV: local
      APP_DEBUG: "false"
      APP_URL: http://localhost:8000
      DB_CONNECTION: pgsql
      DB_HOST: database
      DB_PORT: 5432
      DB_DATABASE: nexo
      DB_USERNAME: nexo
      DB_PASSWORD: nexo_demo_only
      SESSION_DRIVER: file
      SESSION_COOKIE: nexo_session
      SESSION_SECURE_COOKIE: "false"
      CACHE_STORE: array
      QUEUE_CONNECTION: sync
      PHP_CLI_SERVER_WORKERS: "4"
    depends_on:
      database:
        condition: service_healthy
volumes:
  nexo_data:
