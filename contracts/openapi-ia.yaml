openapi: 3.1.1
info:
  title: NexoEntrega 360 — Asistente de IA (fragmento)
  version: 0.1.0
  description: |
    Fragmento del contrato con las rutas del asistente de IA (SPEC-05, ADR-004).
    Se integra en contracts/openapi.yaml cuando exista el contrato base (ADR-001).
    El esquema de salida del modelo es la copia de trabajo del anexo oficial
    contracts/ai-output.schema.json; este contrato describe lo que la API devuelve
    al navegador después de validar esa salida.
    Autenticación provisional hasta ADR-003.
servers:
  - url: http://localhost:8000
    description: Ejecución local
security:
  - sesion: []
paths:
  /api/ai/summaries:
    post:
      operationId: crearResumenIA
      summary: Solicitar un resumen asistido por IA
      description: |
        Solo el rol Coordinador. Selección de 1 a 20 solicitudes ENVIADA de su organización (RF10).
        Orden de validación: 422 (formato) → 404 (pertenencia) → 409 (estado); si falla, el proveedor
        no se invoca. Con salida inválida, timeout de 5 s o fallo del proveedor responde 200 con
        mensaje controlado y resumen determinista (RF12).
      tags: [Asistente IA]
      parameters:
        - $ref: '#/components/parameters/CorrelationId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SolicitudResumen'
            example:
              requestIds: [A-001, A-002]
      responses:
        '200':
          description: Borrador generado por el proveedor o resumen alternativo
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorradorResumen'
              examples:
                proveedor:
                  summary: Salida válida del proveedor
                  value:
                    id: 3f6b1c2e-0d1a-4c7e-9f00-1a2b3c4d5e6f
                    status: BORRADOR
                    aiAssisted: true
                    origin: {type: provider, provider: gemini, model: flash}
                    message: null
                    summary: Dos solicitudes pendientes requieren revisión.
                    recommendations:
                      - requestId: A-001
                        reason: Prioridad ALTA y fecha requerida más próxima.
                        evidenceFields: [prioridad, fechaRequerida]
                    requestIds: [A-001, A-002]
                    createdAt: '2030-01-10T14:00:00Z'
                    approvedBy: null
                    approvedAt: null
                fallback:
                  summary: Timeout o salida inválida
                  value:
                    id: 7a1d2e3f-4b5c-6d7e-8f90-0a1b2c3d4e5f
                    status: BORRADOR
                    aiAssisted: true
                    origin: {type: fallback}
                    message: El asistente no respondió a tiempo; se muestra un resumen automático.
                    summary: '2 solicitudes: 1 ALTA, 1 NORMAL; zonas NORTE y SUR; fecha más próxima 2030-01-11.'
                    recommendations: []
                    requestIds: [A-001, A-002]
                    createdAt: '2030-01-10T14:00:05Z'
                    approvedBy: null
                    approvedAt: null
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
        '422':
          $ref: '#/components/responses/Invalido'
  /api/ai/summaries/{summaryId}/approve:
    post:
      operationId: aprobarResumenIA
      summary: Aprobar un borrador de resumen
      description: |
        Solo el Coordinador de la organización del borrador. Registra aprobador, fecha UTC y un evento
        de auditoría (RF09) en la misma transacción. No reserva, no despacha ni cambia prioridades (RF12).
        Un resumen alternativo también se puede aprobar. Una segunda aprobación devuelve 409.
      tags: [Asistente IA]
      parameters:
        - name: summaryId
          in: path
          required: true
          schema:
            type: string
        - $ref: '#/components/parameters/CorrelationId'
      responses:
        '200':
          description: Borrador aprobado
          headers:
            X-Correlation-Id:
              $ref: '#/components/headers/CorrelationId'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BorradorResumen'
        '401':
          $ref: '#/components/responses/NoAutenticado'
        '403':
          $ref: '#/components/responses/Prohibido'
        '404':
          $ref: '#/components/responses/NoEncontrado'
        '409':
          $ref: '#/components/responses/Conflicto'
components:
  securitySchemes:
    sesion:
      type: apiKey
      in: cookie
      name: nexo_session
      description: Provisional hasta ADR-003 (sesión de servidor revocable propuesta en CL-14).
  parameters:
    CorrelationId:
      name: X-Correlation-Id
      in: header
      required: false
      description: Si falta o es inválido, el servidor genera uno.
      schema:
        type: string
        format: uuid
  headers:
    CorrelationId:
      description: correlationId de la petición, igual al registrado en logs y auditoría.
      schema:
        type: string
        format: uuid
  schemas:
    SolicitudResumen:
      type: object
      additionalProperties: false
      required: [requestIds]
      properties:
        requestIds:
          type: array
          minItems: 1
          maxItems: 20
          uniqueItems: true
          items:
            type: string
            minLength: 1
    Recomendacion:
      type: object
      additionalProperties: false
      required: [requestId, reason, evidenceFields]
      properties:
        requestId:
          type: string
          minLength: 1
        reason:
          type: string
          minLength: 1
          maxLength: 240
        evidenceFields:
          type: array
          minItems: 1
          maxItems: 3
          uniqueItems: true
          items:
            enum: [zona, prioridad, fechaRequerida, observaciones]
    Origen:
      type: object
      additionalProperties: false
      required: [type]
      properties:
        type:
          enum: [provider, replay, fixture, fallback]
        provider:
          type: [string, 'null']
        model:
          type: [string, 'null']
        fixtureId:
          type: [string, 'null']
    BorradorResumen:
      type: object
      additionalProperties: false
      required: [id, status, aiAssisted, origin, message, summary, recommendations, requestIds, createdAt, approvedBy, approvedAt]
      properties:
        id:
          type: string
        status:
          enum: [BORRADOR, APROBADO]
        aiAssisted:
          const: true
        origin:
          $ref: '#/components/schemas/Origen'
        message:
          description: Mensaje controlado cuando se usa el resumen alternativo; null en otro caso.
          type: [string, 'null']
        summary:
          type: string
          minLength: 1
          maxLength: 600
        recommendations:
          type: array
          maxItems: 5
          items:
            $ref: '#/components/schemas/Recomendacion'
        requestIds:
          type: array
          items:
            type: string
        createdAt:
          type: string
          format: date-time
        approvedBy:
          type: [string, 'null']
        approvedAt:
          type: [string, 'null']
          format: date-time
    Error:
      type: object
      additionalProperties: false
      required: [code, message, correlationId]
      properties:
        code:
          type: string
        message:
          type: string
        field:
          type: [string, 'null']
        correlationId:
          type: string
  responses:
    NoAutenticado:
      description: Sin sesión válida
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Prohibido:
      description: Rol distinto de Coordinador
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    NoEncontrado:
      description: Solicitud o borrador inexistente o de otra organización (no revela existencia)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Conflicto:
      description: Solicitud seleccionada fuera de ENVIADA, o borrador ya aprobado
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Invalido:
      description: Selección vacía, con más de 20 IDs, con IDs repetidos o con propiedades extra
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
